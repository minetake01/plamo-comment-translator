name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/verify-tag.mjs "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
